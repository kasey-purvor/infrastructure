[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "image-harvester"
version = "0.1.0"
description = "Harvest all images from an Instagram profile via ScrapFly, saved to disk with a metadata manifest."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "respx>=0.21",
]

[project.scripts]
image-harvester = "image_harvester.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/image_harvester"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
